name: Daily Database Backup

on:
  schedule:
    - cron: '0 6 * * *' # Every day at 6:00 UTC (3:00 AM Argentina)
  workflow_dispatch: # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Create backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          FILENAME="hubents-backup-${TIMESTAMP}.sql.gz"
          docker run --rm -e DATABASE_URL="$DATABASE_URL" postgres:16 \
            sh -c 'pg_dump "$DATABASE_URL" --no-owner --no-acl' | gzip > "$FILENAME"
          echo "BACKUP_FILE=$FILENAME" >> "$GITHUB_ENV"
          echo "Backup created: $FILENAME ($(du -h $FILENAME | cut -f1))"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          aws s3 cp "$BACKUP_FILE" \
            "s3://${R2_BUCKET_NAME}/backups/db/${BACKUP_FILE}" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --region auto
          echo "Backup uploaded to R2: backups/db/${BACKUP_FILE}"

      - name: Upload as GitHub artifact (redundancy)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30

      - name: Cleanup old R2 backups (keep last 30)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          FILES=$(aws s3 ls "s3://${R2_BUCKET_NAME}/backups/db/" --endpoint-url "$ENDPOINT" --region auto | sort | head -n -30 | awk '{print $4}')
          for f in $FILES; do
            aws s3 rm "s3://${R2_BUCKET_NAME}/backups/db/$f" --endpoint-url "$ENDPOINT" --region auto
            echo "Deleted old backup: $f"
          done
